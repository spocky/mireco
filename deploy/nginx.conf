# nginx site for the MiReCo HTTP version (used by the Dockerfile; also works
# as a server block for an existing nginx). Static files only.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Small site; always revalidate so updates show up immediately.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ /\. {
        deny all;
    }

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
